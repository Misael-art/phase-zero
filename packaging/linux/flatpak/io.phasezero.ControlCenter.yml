app-id: io.phasezero.ControlCenter
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: phasezero-control-center
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-run/wayland-0
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.PolicyKit1
modules:
  - name: pyside6
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=. --prefix=/app PySide6_Essentials==6.8.3
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/76/a1/f1958c9d00176044ab00464cd89b6969ef3a7d2ed12d316ff1eda3dec88f/shiboken6-6.8.3-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: 295a003466ca2cccf6660e2f2ceb5e6cef4af192a48a196a32d46b6f0c9ec5cb
      - type: file
        url: https://files.pythonhosted.org/packages/f0/b2/3205336262bf88d57f01503df81ede2a0b1eecbb2a7d58978a5e5625f7c1/PySide6_Essentials-6.8.3-cp39-abi3-manylinux_2_28_x86_64.whl
        sha256: fd57fa0c886ef99b3844173322c0023ec77cc946a0c9a0cdfbc2ac5c511053c1
  - name: phasezero
    buildsystem: simple
    build-commands:
      - install -d /app/lib/phasezero /app/bin /app/share/applications /app/share/metainfo /app/share/icons/hicolor/scalable/apps
      - cp -a linux profiles assets version.json /app/lib/phasezero/
      - chmod +x /app/lib/phasezero/linux/pz /app/lib/phasezero/linux/ui/native.sh
      - install -Dm755 packaging/linux/phasezero-control-center /app/bin/phasezero-control-center
      - install -Dm644 packaging/linux/io.phasezero.ControlCenter.desktop /app/share/applications/io.phasezero.ControlCenter.desktop
      - install -Dm644 packaging/linux/io.phasezero.ControlCenter.metainfo.xml /app/share/metainfo/io.phasezero.ControlCenter.metainfo.xml
      - install -Dm644 packaging/linux/io.phasezero.ControlCenter.svg /app/share/icons/hicolor/scalable/apps/io.phasezero.ControlCenter.svg
    sources:
      - type: git
        url: https://github.com/Misael-art/PhaseZero.git
        tag: v1.22.5
