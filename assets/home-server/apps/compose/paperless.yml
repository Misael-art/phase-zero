# Per-app compose module. Segredos nunca inline.
services:
  paperless-broker:
    image: ${PZ_IMAGE_PAPERLESS_BROKER:-valkey/valkey:8.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-paperless-broker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    command: ["valkey-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - paperless_broker_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  paperless:
    image: ${PZ_IMAGE_PAPERLESS:-ghcr.io/paperless-ngx/paperless-ngx:2.16.3}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-paperless
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.5
    depends_on:
      paperless-broker:
        condition: service_healthy
    environment:
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_REDIS=redis://paperless-broker:6379/0
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:8010:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_consume:/usr/src/paperless/consume
      - paperless_export:/usr/src/paperless/export

volumes:
  paperless_broker_data:
  paperless_data:
  paperless_media:
  paperless_consume:
  paperless_export:
