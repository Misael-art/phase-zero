# Per-app compose module. Segredos nunca inline.
services:
  prometheus:
    image: ${PZ_IMAGE_PROMETHEUS:-prom/prometheus:v3.5.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-prometheus
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:9090:9090"
    volumes:
      - prometheus_data:/prometheus

volumes:
  prometheus_data:
