# Per-app compose module. Segredos nunca inline.
services:
  jellyfin:
    image: ${PZ_IMAGE_JELLYFIN:-jellyfin/jellyfin:10.10.7}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-jellyfin
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 2048m
    cpus: 2.0
    ports:
      - "${HOMELAB_PUBLIC_BIND_ADDR:-127.0.0.1}:8096:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${HOMELAB_MEDIA_DIR:-./media}:/media:ro

volumes:
  jellyfin_config:
  jellyfin_cache:
