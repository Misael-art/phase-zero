# PhaseZero homelab-stack — camada EXTRAS (pesada, opt-in). Rode adicionalmente:
#   docker compose -f docker-compose.extras.yml up -d
# Mais RAM/CPU; não recomendado nos modos que enxugam o SO. Segredos NUNCA inline (use .env/ambiente).
# Portainer fica aqui como opt-in. NUNCA monta /var/run/docker.sock direto:
# fala com o socket via socket-proxy (allowlist de ambient nativa), e o proxy
# só alcança o admin bind (127.0.0.1), nunca exposto cru na WAN.
name: phasezero-homelab-extras

services:
  # Proxy de privilégio mínimo para o socket do Docker: expõe apenas os
  # recursos que o Portainer realmente usa (containers/tasks), em rede interna.
  socket-proxy:
    image: ${PZ_IMAGE_SOCKET_PROXY:-tecnativa/docker-socket-proxy:0.2.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-socket-proxy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.25
    networks:
      - pz-internal
    environment:
      CONTAINERS: "1"
      TASKS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Gestão visual da stack Docker (opt-in). Só com HOMELAB_ADMIN_BIND_ADDR=127.0.0.1.
  portainer:
    image: ${PZ_IMAGE_PORTAINER:-portainer/portainer-ce:2.33.2}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-portainer
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    networks:
      - pz-internal
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:9000:9000"
    environment:
      DOCKER_HOST: "tcp://socket-proxy:2375"
    volumes:
      - portainer_data:/data
    depends_on:
      - socket-proxy

  # "Drive" completo (alternativa pesada ao Syncthing)
  nextcloud-db:
    image: ${PZ_IMAGE_MARIADB:-mariadb:11.8.3}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-nextcloud-db
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    networks:
      - pz-internal
    environment:
      - MARIADB_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASSWORD}
      - MARIADB_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      - MARIADB_DATABASE=nextcloud
      - MARIADB_USER=nextcloud
    volumes:
      - nextcloud_db:/var/lib/mysql

  nextcloud:
    image: ${PZ_IMAGE_NEXTCLOUD:-nextcloud:31.0.6}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-nextcloud
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.0
    networks:
      - pz-internal
    depends_on:
      - nextcloud-db
    environment:
      - MYSQL_HOST=nextcloud-db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:8080:80"
    volumes:
      - nextcloud_data:/var/www/html

  # Observabilidade
  prometheus:
    image: ${PZ_IMAGE_PROMETHEUS:-prom/prometheus:v3.5.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-prometheus
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:9090:9090"
    volumes:
      - prometheus_data:/prometheus

  node-exporter:
    image: ${PZ_IMAGE_NODE_EXPORTER:-prom/node-exporter:v1.9.1}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-node-exporter
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:9100:9100"

  grafana:
    image: ${PZ_IMAGE_GRAFANA:-grafana/grafana:12.0.2}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-grafana
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  # OCR de documentos (broker Valkey obrigatório; ver apps/compose/paperless.yml)
  paperless-broker:
    image: ${PZ_IMAGE_PAPERLESS_BROKER:-valkey/valkey:8.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-paperless-broker
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    command: ["valkey-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - paperless_broker_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
  paperless:
    image: ${PZ_IMAGE_PAPERLESS:-ghcr.io/paperless-ngx/paperless-ngx:2.16.3}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-paperless
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.5
    depends_on:
      paperless-broker:
        condition: service_healthy
    environment:
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_REDIS=redis://paperless-broker:6379/0
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:8010:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_consume:/usr/src/paperless/consume
      - paperless_export:/usr/src/paperless/export

  # Workflows/automação
  n8n:
    image: ${PZ_IMAGE_N8N:-docker.n8n.io/n8nio/n8n:1.100.1}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: phasezero-n8n
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 1.0
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    ports:
      - "${HOMELAB_ADMIN_BIND_ADDR:-127.0.0.1}:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

networks:
  pz-internal:
    internal: true

volumes:
  portainer_data:
  nextcloud_db:
  nextcloud_data:
  prometheus_data:
  grafana_data:
  paperless_broker_data:
  paperless_data:
  paperless_media:
  paperless_consume:
  paperless_export:
  n8n_data: