name: release

# Publishes a full set of Linux packages whenever a version tag is pushed.
# Prepare a release with:  packaging/release.sh <version> --push
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to build (e.g. v1.7.3)'
        required: false
      allow_red_ci:
        description: 'Publish even if the ci workflow is not green (emergency only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # needed to create the GitHub Release
  actions: read     # needed to read the ci workflow conclusion for this commit

jobs:
  # A tag must never ship code the ci workflow rejected. Packages only build
  # after ci is proven green for the exact commit being released; the
  # workflow_dispatch override exists for emergencies and is logged.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Require a green ci run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_RED_CI: ${{ github.event.inputs.allow_red_ci }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "release commit: $sha"
          if [ "${ALLOW_RED_CI:-false}" = "true" ]; then
            echo "::warning::ci gate bypassed by explicit allow_red_ci for $sha"
            exit 0
          fi
          # ci is triggered by the branch push, so it may still be running when
          # the tag lands. Wait for a conclusion rather than racing it.
          deadline=$(( SECONDS + 2700 ))
          conclusion=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            runs="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100")"
            total="$(jq -r '.total_count' <<<"$runs")"
            if [ "$total" = "0" ]; then
              echo "no ci run for $sha yet; waiting"
              sleep 30
              continue
            fi
            # Newest run wins: a re-run after a fix is the authoritative result.
            conclusion="$(jq -r '[.workflow_runs[]] | sort_by(.run_started_at) | last | .conclusion // "pending"' <<<"$runs")"
            [ "$conclusion" = "pending" ] || [ "$conclusion" = "null" ] || break
            echo "ci still running for $sha; waiting"
            conclusion=""
            sleep 30
          done
          if [ "$conclusion" != "success" ]; then
            echo "::error::ci conclusion for $sha is '${conclusion:-timed-out}'; refusing to publish a release" >&2
            exit 1
          fi
          echo "ci is green for $sha"

  # Native packages (deb, rpm, Arch, AppImage, source) built on Arch, which is
  # the only distro shipping makepkg. makepkg refuses to run as root, so the
  # build runs as an unprivileged user.
  linux-packages:
    needs: ci-gate
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git jq python python-pip python-pytest pyside6 \
            dpkg rpm-tools squashfs-tools curl sudo

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify tag matches version.json
        run: |
          set -euo pipefail
          v="$(jq -r '.version' version.json)"
          ref="${{ github.event.inputs.ref || github.ref_name }}"
          expected="v$v"
          if [ "$ref" != "$expected" ]; then
            echo "tag/ref '$ref' does not match version.json ($expected)" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build native packages (unprivileged)
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder env \
            PZ_SKIP_FLATPAK=1 \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            bash packaging/linux/build-all.sh "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar*
            dist/*.AppImage
            dist/*-source.tar.gz
          if-no-files-found: error

  # Flatpak needs org.kde.Platform//6.11 and a privileged flatpak-builder
  # sandbox. It runs in the flathub CI image and is best-effort: a failure here
  # never blocks shipping the native packages.
  flatpak:
    needs: ci-gate
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Read version
        run: echo "VERSION=$(jq -r '.version' version.json)" >> "$GITHUB_ENV"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PhaseZero-${{ env.VERSION }}.flatpak
          manifest-path: packaging/linux/flatpak/io.phasezero.ControlCenter.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: PhaseZero-*.flatpak
          if-no-files-found: warn

  # Collect every artifact, produce one authoritative SHA256SUMS and publish
  # the GitHub Release. Runs even if the flatpak job failed.
  release:
    runs-on: ubuntu-latest
    needs: [ci-gate, linux-packages, flatpak]
    if: always() && needs.ci-gate.result == 'success' && needs.linux-packages.result == 'success'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Read version and release channel
        run: |
          set -euo pipefail
          version="$(jq -r '.version' version.json)"
          channel="$(jq -r '.channel // "stable"' version.json)"
          case "$channel" in
            stable|beta|nightly) ;;
            *) echo "unsupported release channel: $channel" >&2; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Describe preview limits
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "stable" ]; then
            : > release-channel-notes.md
          else
            cat > release-channel-notes.md <<'EOF'
          > **Preview channel.** This build does not close the PXA acceptance gates.
          > Real account/session/quota evidence (G3), request-bound consumer grants and
          > no-paid-fallback enforcement (PXA-008/009), complete Windows clean-host
          > validation (G2), and five-person usability validation (G4) remain open.
          > Managed inference stays fail-closed. The PXA-010 Codex Web bridge remains
          > outside the product catalog; PXA-011–013 remain unavailable.
          EOF
          fi

      - uses: actions/download-artifact@v8
        with:
          path: staging

      - name: Flatten and checksum artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find staging -type f -exec cp -n {} dist/ \;
          cd dist
          ls -la
          sha256sum -- * > "SHA256SUMS-$VERSION"
          cat "SHA256SUMS-$VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: PhaseZero v${{ env.VERSION }} (${{ env.CHANNEL }})
          prerelease: ${{ env.CHANNEL != 'stable' }}
          make_latest: ${{ env.CHANNEL == 'stable' }}
          body_path: release-channel-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar*
            dist/*.AppImage
            dist/*.flatpak
            dist/*-source.tar.gz
            dist/SHA256SUMS-*
