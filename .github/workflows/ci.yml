name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

# Push e pull_request do mesmo SHA disparam duas rodadas completas em
# paralelo; sem grupo, as rodadas brigam por concorrência e jobs saem como
# "canceled" no meio da varredura (shell-lint levava ~6 min e morria aos 4).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -Repository PSGallery

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -Force
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Warning,Error -ExcludeRule 'PSUseShouldProcessForStateChangingFunctions','PSAvoidUsingInvokeExpression'
          if ($results) {
            $results | Format-Table -AutoSize
            # Treat only Error severity as blocking for now
            $errors = $results | Where-Object { $_.Severity -eq 'Error' }
            if ($errors) { exit 1 }
          }

  shell-lint:
    runs-on: ubuntu-latest
    strategy:
      # As duas versoes existem para pegar defeitos diferentes. Com o fail-fast
      # padrao, a primeira perna que falha cancela a outra no meio: o SC2016 na
      # 0.11.0 abortou a 0.9.0 e escondeu um SC2015 por uma release inteira.
      fail-fast: false
      matrix:
        shellcheck_version: ['0.9.0', '0.11.0']
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck ${{ matrix.shellcheck_version }}
        run: |
          set -euo pipefail
          V="${{ matrix.shellcheck_version }}"
          if [ "$V" = "0.9.0" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          else
            curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${V}/shellcheck-v${V}.linux.x86_64.tar.xz" -o /tmp/shellcheck.tar.xz
            tar -xJf /tmp/shellcheck.tar.xz -C /tmp
            sudo mv "/tmp/shellcheck-v${V}/shellcheck" /usr/local/bin/shellcheck
          fi
          shellcheck --version

      - name: Run shellcheck on all shell scripts
        run: |
          set -euo pipefail
          EXCLUDES="SC1090,SC1091,SC2034,SC2154,SC2155,SC2312"
          # Selecting by extension skipped every entry point that has none, so
          # linux/pz - the CLI the whole product is driven through - was never
          # linted, and a defect there survived in a file edited constantly.
          # Shell scripts are identified by their shebang instead.
          # Tracked files only. A bare find also sweeps build artefacts and
          # vendored node_modules, which are absent from a clean checkout but
          # would make this pass depend on what happens to be lying around.
          errors=0
          checked=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1))
            if ! shellcheck -x -e "$EXCLUDES" "$f"; then
              ((errors++)) || true
            fi
          done < <(bash tools/list-shell-scripts.sh)
          if [ "$errors" -gt 0 ]; then
            echo "::warning::shellcheck: $errors of $checked file(s) failed (excludes: $EXCLUDES)"
            exit 1
          fi
          echo "shellcheck: $checked shell scripts passed"

      - name: Check for pipefail + grep -q pattern
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            if grep -q 'set.*pipefail' "$f" 2>/dev/null && grep -q 'grep -q' "$f" 2>/dev/null; then
              echo "::warning file=$f::$f uses pipefail AND grep -q (SIGPIPE risk)"
              ((found++)) || true
            fi
          done < <(bash tools/list-shell-scripts.sh)
          echo "pipefail+grep-q files: $found"
          # Non-blocking — informational

  homelab-shell-test:
    runs-on: ubuntu-latest
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7

      - name: Install jq and ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq ripgrep

      - name: Syntax-check every shell script
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            bash -n "$f"
          done < <(bash tools/list-shell-scripts.sh)
          echo "bash -n: all shell scripts passed"

      - name: Validate homelab registry and compose lock JSON
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1 and (.profiles|length) == 6' assets/home-server/homelab-profiles.json >/dev/null
          jq -e '.schemaVersion == 1 and (.images|type == "object") and (.images|length) == 14 and all(.images[]; (test(":latest") | not))' assets/home-server/docker-compose.lock.json >/dev/null
          jq -e '.schemaVersion == 1 and (.apps|length) >= 10 and all(.apps[].imageRef; (test(":latest") | not))' assets/home-server/apps/catalog.json >/dev/null

      - name: Run hermetic homelab fault suite (no docker daemon expected)
        run: |
          set -euo pipefail
          # docker is present in the runner; the suite must still pass without
          # a daemon because it only exercises env-overridable paths.
          bash tests/linux-homelab.sh

      - name: Block Hermes use without request-bound account grants
        run: |
          set -euo pipefail
          bash tests/linux-hermes-grant-gate.sh

      - name: Block OpenClaw use without request-bound account grants
        run: |
          set -euo pipefail
          bash tests/linux-openclaw-grant-gate.sh

      - name: Proxy manifest contract holds (PZ-AUD-019)
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/fake-home"
          mkdir -p "$HOME"
          ./linux/pz ai proxies manifest | jq -e '.ok == true'

      - name: Run tuning suites (apply/revert/status contract)
        run: |
          set -euo pipefail
          # Ambas rodam em HOME sandboxado e sem admin bridge: as mutações root
          # degradam para no-op anunciado, o contrato user-scope é exercido.
          bash tests/linux-tuning.sh
          bash tests/linux-tuning-lifecycle.sh

  homelab-integration-disposable:
    runs-on: ubuntu-latest
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7

      - name: Install jq and ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq ripgrep

      - name: E2E backup -> destroy -> restore -> data equality on disposable volumes
        run: |
          set -euo pipefail
          # Volume mountpoints are root-owned; the homelab CLI writes them as root
          # (same privilege model as the appliance host).
          run_pz() { sudo -n PZ_HOMELAB_STATE="$PZ_HOMELAB_STATE" \
            PZ_HOMELAB_BACKUP_ROOT="$PZ_HOMELAB_BACKUP_ROOT" \
            PZ_HOMELAB_VOLUMES_OVERRIDE='vaultwarden_data syncthing_data' "$@"; }
          export PZ_HOMELAB_STATE="$RUNNER_TEMP/pz-state"
          export PZ_HOMELAB_BACKUP_ROOT="$RUNNER_TEMP/pz-backups"
          mkdir -p "$PZ_HOMELAB_STATE" "$PZ_HOMELAB_BACKUP_ROOT"
          docker volume create phasezero-homelab_vaultwarden_data >/dev/null
          docker volume create phasezero-homelab_syncthing_data >/dev/null
          docker pull -q busybox:latest >/dev/null
          docker run --rm --network=host -v phasezero-homelab_vaultwarden_data:/data busybox sh -c 'echo db-secret-42 > /data/db.sqlite'
          docker run --rm --network=host -v phasezero-homelab_syncthing_data:/data busybox sh -c 'echo sentinel-sync > /data/a.txt'

          bk="$(run_pz ./linux/pz server homelab backup --dest "$PZ_HOMELAB_BACKUP_ROOT/bk1" 2>/dev/null | grep -v '^INFO:')"
          jq -e '.ok == true and (.volumes | length) == 2' <<<"$bk" >/dev/null
          vf="$(run_pz ./linux/pz server homelab backup verify --source "$PZ_HOMELAB_BACKUP_ROOT/bk1" 2>/dev/null | grep -v '^INFO:')"
          jq -e '.verified == true' <<<"$vf" >/dev/null
          echo "backup + verify ok"

          docker volume rm phasezero-homelab_vaultwarden_data >/dev/null
          docker volume rm phasezero-homelab_syncthing_data >/dev/null
          docker volume create phasezero-homelab_vaultwarden_data >/dev/null
          docker volume create phasezero-homelab_syncthing_data >/dev/null

          rs="$(run_pz ./linux/pz server homelab restore --source "$PZ_HOMELAB_BACKUP_ROOT/bk1" --yes 2>/dev/null | grep -v '^INFO:')"
          jq -e '.ok == true and .preRestore != null' <<<"$rs" >/dev/null

          test "$(docker run --rm --network=host -v phasezero-homelab_vaultwarden_data:/data busybox cat /data/db.sqlite)" = "db-secret-42"
          test "$(docker run --rm --network=host -v phasezero-homelab_syncthing_data:/data busybox cat /data/a.txt)" = "sentinel-sync"
          echo "restore data equality ok (real docker volumes)"

      - name: Restore converges exact state on real volumes (PZ-AUD-010)
        run: |
          set -euo pipefail
          run_pz() { sudo -n PZ_HOMELAB_STATE="$PZ_HOMELAB_STATE" \
            PZ_HOMELAB_BACKUP_ROOT="$PZ_HOMELAB_BACKUP_ROOT" \
            PZ_HOMELAB_VOLUMES_OVERRIDE='vaultwarden_data syncthing_data' "$@"; }
          export PZ_HOMELAB_STATE="$RUNNER_TEMP/pz-state"
          export PZ_HOMELAB_BACKUP_ROOT="$RUNNER_TEMP/pz-backups"
          # Unlisted archives are never applied; post-backup files are removed.
          docker run --rm --network=host -v phasezero-homelab_vaultwarden_data:/data busybox sh -c 'echo posterior-data > /data/posterior.txt'
          # Os backups sao criados pelo passo anterior sob sudo e ficam do
          # root, como devem: sao dados de aplicacao, nao artefato publico.
          # Plantar o arquivo nao listado exige o mesmo privilegio de quem
          # escreveu o diretorio — copiar como runner so provava o umask.
          sudo -n cp "$PZ_HOMELAB_BACKUP_ROOT/bk1/vaultwarden_data.tgz" "$PZ_HOMELAB_BACKUP_ROOT/bk1/evil_extra.tgz"
          rs="$(run_pz ./linux/pz server homelab restore --source "$PZ_HOMELAB_BACKUP_ROOT/bk1" --yes 2>/dev/null | grep -v '^INFO:')"
          jq -e '.ok == true' <<<"$rs" >/dev/null
          test "$(docker run --rm --network=host -v phasezero-homelab_vaultwarden_data:/data busybox cat /data/db.sqlite)" = "db-secret-42"
          if docker run --rm --network=host -v phasezero-homelab_vaultwarden_data:/data busybox test -e /data/posterior.txt; then
            echo "post-backup file survived restore" >&2; exit 1
          fi
          if docker run --rm --network=host -v phasezero-homelab_syncthing_data:/data busybox test -e /data/evil_extra/evil.txt; then
            echo "unlisted archive was applied" >&2; exit 1
          fi
          echo "restore exactness ok (real docker volumes)"

  homelab-apps-disposable:
    runs-on: ubuntu-latest
    needs: shell-lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install jq curl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl

      - name: Enable vaultwarden then disable without starting neighbours
        run: |
          set -euo pipefail
          export PZ_HOMELAB_APPS_DISPOSABLE=1
          export PZ_HOMELAB_STATE="$RUNNER_TEMP/pz-apps-state"
          export PZ_HOMELAB_PROJECT="pzhlapps${GITHUB_RUN_ID}"
          export PZ_HOMELAB_RAM_TOTAL_OVERRIDE=32768
          mkdir -p "$PZ_HOMELAB_STATE"
          bash tests/linux-homelab-apps-disposable.sh

  homelab-python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Python test deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            xvfb xauth libx11-6 libx11-xcb1 libxext6 libxrender1 libsm6 libice6 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-xinput0 libxcb-util1 libxkbcommon-x11-0
          python3 -m venv /tmp/pz-venv
          # PySide6 6.12.0 aborts with SIGSEGV after a fully passing suite.
          # 6.11.1 exits 0 on the same tests. Keep the pin until that is gone.
          /tmp/pz-venv/bin/pip install -q pytest pytest-timeout 'PySide6==6.11.1' argon2-cffi

      - name: Run homelab player tests (offscreen)
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          /tmp/pz-venv/bin/python -m pytest tests/test_homelab_player.py \
            tests/test_homelab_agent_contract.py \
            tests/test_homelab_web_contract.py -q \
            --timeout=90 --timeout-method=thread

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose for core and core+extras
        run: |
          set -euo pipefail
          docker compose version >/dev/null
          # docker compose config is client-side and needs no daemon.
          for k in VW_ADMIN_TOKEN NEXTCLOUD_DB_ROOT_PASSWORD NEXTCLOUD_DB_PASSWORD \
                   GRAFANA_ADMIN_PASSWORD N8N_ENCRYPTION_KEY PAPERLESS_SECRET_KEY; do
            export "$k=smoke"
          done
          docker compose -f assets/home-server/docker-compose.homelab.yml config --quiet
          docker compose -f assets/home-server/docker-compose.homelab.yml \
            -f assets/home-server/docker-compose.extras.yml config --quiet
          jq -e '.schemaVersion == 1 and (.apps|length) >= 10' assets/home-server/apps/catalog.json >/dev/null
          jq -e 'all(.apps[].imageRef; (test(":latest") | not))' assets/home-server/apps/catalog.json >/dev/null
          for f in assets/home-server/apps/compose/*.yml; do
            docker compose -f "$f" config --quiet
          done
          cfg="$(docker compose -f assets/home-server/docker-compose.homelab.yml \
            -f assets/home-server/docker-compose.extras.yml config --format json)"
          # The docker socket may only be bound by the dedicated socket-proxy,
          # read-only; every other service must reach docker via nothing at all.
          sock_binds="$(jq -c '[.services | to_entries[] | . as $s | ($s.value.volumes // [])[] | select(.source == "/var/run/docker.sock") | {svc: $s.key, ro: (.read_only // false)}]' <<<"$cfg")"
          jq -e '
            length == 1
            and .[0].svc == "socket-proxy"
            and .[0].ro == true
          ' <<<"$sock_binds" >/dev/null
          # At least one service carries a memory limit.
          jq -e '([.services[] | .deploy.resources.limits.memory? // .mem_limit?] | map(select(. != null)) | length) > 0' <<<"$cfg" >/dev/null

  security-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the tree for leaked secrets
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner -v

  # Shared legacy job id retained for existing acceptance references. Runner
  # uses an Arch container: proves Arch repo/package behavior, not clean-host
  # or VM-snapshot G2 evidence.
  arch-clean-host:
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Base tools on the clean host
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed base-devel python python-pytest jq git sudo
          # Product-declared extra repos (profiles archRepos) are enabled by
          # the installer at runtime; CI enables them here so the live
          # resolution gate proves the full story on disposable iron.
          if grep -Eq '^\[multilib\]' /etc/pacman.conf; then
            :
          elif grep -Eq '^#\[multilib\]' /etc/pacman.conf; then
            sed -i '/^#\[multilib\]/,/^#Include/s/^#//' /etc/pacman.conf
          else
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          fi
          grep -Eq '^\[multilib\]' /etc/pacman.conf
          pacman -Sy

      - name: Profile manifests resolve in official Arch repos
        run: |
          set -euo pipefail
          python -m pytest tests/test_profile_packages.py -q

      - name: Build the release asset as an unprivileged user
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && bash packaging/linux/arch/build-arch.sh"

      - name: Install the asset, prove entrypoints and fail-closed status
        run: |
          set -euo pipefail
          pacman -U --noconfirm "$GITHUB_WORKSPACE"/dist/phasezero-control-center-*.pkg.tar.zst
          test -x /usr/bin/pz
          test -x /usr/bin/phasezero-control-center
          pz --version
          # Packaged tree serves diagnostics with no checkout and no daemon.
          out="$(pz server homelab status --json 2>/dev/null)"
          jq -e '.schemaVersion == "1" and .ready == false and (.reasons | type == "array")' <<<"$out" >/dev/null
          out="$(pz server homelab prepare --dry-run --json 2>/dev/null)"
          jq -e '.action == "prepare" and .dryRun == true' <<<"$out" >/dev/null

      - name: Cancel real pacman from the public Development UI in disposable Arch
        env:
          PZ_ENABLE_ARCH_PACMAN_UI_CONTAINER: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_development_cancel.py -q

      - name: Verify real pacman cancellation and worker-crash recovery in disposable Arch
        env:
          PZ_ENABLE_ARCH_PACMAN_CONTAINER: "1"
        run: python "$GITHUB_WORKSPACE/tests/pacman_cancel_disposable_arch.py"

      - name: Run public Development install-use-rollback journey in disposable Arch
        env:
          PZ_ENABLE_ARCH_PUBLIC_JOURNEY_CONTAINER: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_development_journey_arch_container.py -q -s

  hosted-qemu-kvm-probe:
    # Check whether an isolated hosted Linux runner can support future real-VM
    # G2 work. This empty guest probe is not itself G2 evidence.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

      - name: Probe hosted QEMU/KVM with an empty disposable guest
        run: bash tests/probe_hosted_qemu_kvm.sh

  package-smoke:
    runs-on: ubuntu-latest
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7

      - name: Install smoke deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq ripgrep

      - name: Stage runtime into install root and validate
        run: |
          set -euo pipefail
          bash packaging/install-root-smoke.sh

  shell-test:
    runs-on: ubuntu-latest
    needs: shell-lint
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq curl git gnupg python3 python3-pil nodejs npm unzip xz-utils ripgrep yad ovmf sddm qemu-utils

      - name: Run full shell test suite
        run: |
          set -euo pipefail
          bash tests/runner.sh

  windows-vm-shell-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Windows VM test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq file p7zip-full genisoimage qemu-utils

      - name: Run Windows VM shell suites (hermetic)
        run: |
          set -euo pipefail
          bash -n linux/windows-vm/provision.sh
          bash -n linux/windows-vm/windows-vm.sh
          bash -n linux/windows-vm/windows-vm-session.sh
          bash -n linux/windows-vm/boot-runtime-notice.sh
          bash -n linux/windows-vm/media-inspect.sh
          bash tests/linux-windows-vm.sh
          bash tests/test_provision.sh
          bash tests/test_provision_recovery.sh
          bash tests/test_windows_vm_remove.sh
          bash tests/test_windows_vm_session.sh
          bash tests/test_boot_runtime_notice.sh

  python-test:
    runs-on: ubuntu-latest
    # Qt subprocess regressions must report a failing test, never consume a
    # runner indefinitely with no live log output.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Python test deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 \
            libxcb-xfixes0 libxcb-xkb1 libx11-xcb1 qemu-utils
          python3 -m venv /tmp/pz-venv
          # Same pin as homelab-python-test: PySide6 6.12.0 segfaults at exit.
          /tmp/pz-venv/bin/pip install -q pytest pytest-timeout 'PySide6==6.11.1' pillow argon2-cffi

      - name: Run pytest (offscreen)
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=offscreen
          # timeout-method=thread, not the default signal method: SIGALRM only
          # interrupts the main thread once it returns to Python bytecode, so a
          # test blocked in a subprocess or a socket read is never reclaimed.
          # A hang then consumes the whole job timeout and the run is cancelled
          # with no failing test named, which is exactly what happened on
          # e91bcaf. The thread method dumps every thread's stack and kills the
          # process, so the culprit appears in the log.
          /tmp/pz-venv/bin/python -m pytest tests/ -q -vv \
            --timeout=90 --timeout-method=thread

      - name: Verify UI hit-test at 100%, 150%, and 200% on isolated Xvfb
        run: |
          set -euo pipefail
          export QT_QPA_PLATFORM=xcb
          export PZ_REQUIRE_UI_HIT_TEST=1
          export PZ_EXPECT_QSCREEN_WIDTH=1280
          export PZ_EXPECT_QSCREEN_HEIGHT=800
          for spec in "1:1280x800x24" "1.5:1920x1200x24" "2:2560x1600x24"; do
            scale="${spec%%:*}"
            screen="${spec#*:}"
            export HOME="$RUNNER_TEMP/pz-ui-home-$scale"
            mkdir -p "$HOME"
            export XDG_CONFIG_HOME="$HOME/.config"
            export XDG_DATA_HOME="$HOME/.local/share"
            export XDG_STATE_HOME="$HOME/.local/state"
            mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
            export PZ_EXPECT_DEVICE_SCALE="$scale"
            echo "Xvfb UI hit-test scale=$scale screen=$screen"
            QT_SCALE_FACTOR="$scale" QT_DEBUG_PLUGINS=1 xvfb-run --auto-servernum \
              --server-args="-screen 0 $screen -dpi 96" \
              /tmp/pz-venv/bin/python -m pytest \
              'tests/test_product_registry_ui.py::test_product_host_controls_fit_and_receive_pointer_at_supported_widths' \
              -q
          done

  pester:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester 3.4.0 and PSScriptAnalyzer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 3.4.0 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Parse PowerShell
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $errors = @()
          foreach ($f in Get-ChildItem -Recurse -File -Include *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                $errors += ("{0}:{1}: {2}" -f $f.FullName, $err.Extent.StartLineNumber, $err.Message)
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run focused AI tools Pester block
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 3.4.0
          $result = Invoke-Pester -Path .\tests\ai-tools.tests.ps1 -TestName 'AI coding tool support' -PassThru
          if ([int]$result.TotalCount -eq 0 -or [int]$result.FailedCount -gt 0) { exit 1 }

      - name: Run Pester
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 3.4.0
          Invoke-Pester -Path .\tests -EnableExit

      - name: Setup Python for Windows credential-store fixtures
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Run hermetic Windows credential-store fixtures
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest tests/test_windows_credential_store.py tests/test_credential_vault.py -k windows -q

      - name: Verify native Windows Credential Manager and DPAPI on the disposable runner
        shell: powershell
        run: python -m pytest tests/test_windows_native_store_smoke.py -q
